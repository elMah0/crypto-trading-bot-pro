mode:
  dry_run: true
  initial_simulated_balance: 200.0
  quote_currency: USDT
exchange:
  name: binance
  testnet: false
  rate_limit_delay_ms: 250
  timeout_seconds: 30
  max_retries: 3
  transaction_fee_percent: 0.1
symbols:
- BTC/USDT
- ETH/USDT
- SOL/USDT
- BNB/USDT
- XRP/USDT
strategy:
  macro:
    timeframe: 1d
    limit_candles: 30
    sma_period: 10
    adx_period: 14
    adx_min_strength: 18.0
  micro:
    timeframe: 1h
    limit_candles: 60
    rsi_period: 14
    rsi_max_entry: 62.0
    rsi_min_entry: 30.0
    volume_sma_period: 10
    volume_factor: 0.85
risk:
  position_size_percent: 5.0
  max_concurrent_trades: 5
  stop_loss_percent: 1.5
  take_profit_percent: 2.0
  transaction_fee_percent: 0.1
  enable_breakeven: true
  trailing_stop:
    enabled: true
    activation_profit_percent: 1.2
    callback_percent: 0.8
  circuit_breaker:
    max_daily_loss_percent: 6.0
    sl_cooldown_hours: 2
ai:
  enabled: true
  min_confidence_score: 70.0
  provider: gemini
  model: gemini-flash-latest
telegram:
  enabled: true
  send_heartbeat: true
  heartbeat_interval_minutes: 60
  daily_report_hour: '20:00'
database:
  db_path: trading_bot.db
bot_loop:
  check_interval_seconds: 60
